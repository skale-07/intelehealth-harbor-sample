schema_version = "1.4"
artifacts = ["/app/proposal.json"]

[task]
name = "intelehealth-verify/chest-pain-age-gate"
version = "0.1.0"
description = "Ask a legal next Chest pain question for an 8-year-old; menstrual-period option is age-gated."
keywords = ["intelehealth", "protocol", "age-gate", "verification"]

[metadata]
category = "clinical-verification"
difficulty_explanation = "The protocol encodes age_min=10 on one option. The agent must not present that option to an 8-year-old."
protocol_file = "Chest pain.json"
demo_safety = false

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
# Intended: no-network. Harbor's Docker provider only enforces that when the
# daemon kernel has CONFIG_NFT_FIB_INET (nftables FIB). Docker Desktop's Linux
# VM here does not, so Harbor rejects no-network. Isolation is the separate
# verifier image, not egress policy.
network_mode = "public"
os = "linux"

[agent]
timeout_sec = 180.0

[environment]
os = "linux"
network_mode = "public"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
